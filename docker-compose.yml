services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filmes}
      POSTGRES_USER: ${POSTGRES_USER:-filmes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmes}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - filmes

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-filmes}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-filmes}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-filmes}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - filmes

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - filmes

volumes:
  pgdata:

networks:
  filmes:
